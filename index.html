<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORIN — Ojek Online</title><style>
:root{--p:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e6e9ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}.app{max-width:1100px;margin:auto}.top{position:sticky;top:0;z-index:3;background:#fff;border-bottom:1px solid var(--line);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:28px;font-weight:900;color:var(--p)}.tag{font-size:11px;color:var(--muted)}.role,.nav{display:flex;gap:6px}.role button,.nav button{border:0;padding:10px 12px;border-radius:10px;background:#f2f4f7}.role .active,.nav .active{background:var(--p);color:#fff}.nav{padding:12px 20px;background:#fff;border-bottom:1px solid var(--line);overflow:auto}.nav button{white-space:nowrap}main{padding:20px}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 6px 24px #00000009}.map{height:350px;border-radius:15px;background:linear-gradient(140deg,#dbeafe,#dcfce7);position:relative;overflow:hidden}.map:before{content:"";position:absolute;inset:-30px;background:repeating-linear-gradient(25deg,transparent 0 35px,#fff9 36px 39px),repeating-linear-gradient(115deg,transparent 0 55px,#fff9 56px 59px)}.route{position:absolute;z-index:1;left:25%;top:54%;width:50%;height:6px;background:var(--p);border-radius:99px;transform:rotate(-17deg)}.pin{position:absolute;z-index:2;font-size:32px}.a{left:23%;top:64%}.b{left:74%;top:35%}label{display:block;font-size:12px;font-weight:800;margin:12px 0 6px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px}.services{display:grid;grid-template-columns:1fr 1fr;gap:8px}.service{padding:12px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:11px}.service.sel{border:2px solid var(--p);background:#eff6ff}.service b{display:block}.muted{color:var(--muted);font-size:13px}.btn{width:100%;border:0;border-radius:11px;padding:13px;background:var(--p);color:#fff;font-weight:800;margin-top:12px}.price{font-size:28px;font-weight:900;margin-top:13px}.status{margin-top:12px;padding:13px;border-radius:12px;background:#eff6ff}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:24px;margin-top:5px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.row{display:flex;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:11px;margin:8px 0}.car{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center}.carpic{height:70px;border-radius:12px;background:#dbeafe;display:grid;place-items:center;font-size:32px}@media(max-width:800px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:520px){main{padding:12px}.services{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">ORIN</div><div class="tag">Mudah Pergi, Mudah Kirim, Mudah Pesan.</div></div><div class="role"><button class="active" onclick="role('passenger',this)">Penumpang</button><button onclick="role('driver',this)">Driver</button><button onclick="role('admin',this)">Admin</button></div></header><nav id="nav" class="nav"></nav><main id="main"></main></div>
<script>
const A={role:'passenger',page:'home',service:'motor',online:false,orders:JSON.parse(localStorage.getItem('orin_orders')||'[]'),tariff:{motor:[7000,3500,10000],car:[12000,5500,15000],comfort:[18000,7000,22000],xl:[22000,8000,28000]},cars:[['Toyota Avanza','ORIN Mobil','2023','B 1234 OIN'],['Toyota Innova','ORIN Comfort','2024','B 5678 OIN'],['Toyota Calya','ORIN XL','2023','B 9012 OIN']]};
const sv={motor:['ORIN Motor','🛵'],car:['ORIN Mobil','🚗'],comfort:['ORIN Comfort','🚘'],xl:['ORIN XL','🚐'],send:['ORIN Send','📦'],food:['ORIN Food','🍜'],mart:['ORIN Mart','🛒'],pulsa:['ORIN Pulsa','📱'],bill:['ORIN Tagihan','🧾']};
const money=n=>'Rp '+Math.round(n).toLocaleString('id-ID');function save(){localStorage.setItem('orin_orders',JSON.stringify(A.orders))}function role(r,b){A.role=r;A.page=r==='passenger'?'home':r;document.querySelectorAll('.role button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function render(){let items=A.role==='passenger'?[['home','🏠 Beranda'],['price','💰 Cek Harga'],['cars','🚗 Daftar Mobil'],['history','📋 Riwayat'],['profile','👤 Profil']]:A.role==='driver'?[['driver','🛵 Dashboard'],['orders','📥 Order'],['income','💵 Pendapatan']]:[['admin','📊 Dashboard'],['orders','📋 Order'],['tariff','💰 Tarif'],['cars','🚗 Kendaraan']];nav.innerHTML=items.map(i=>`<button class="${A.page===i[0]?'active':''}" onclick="A.page='${i[0]}';render()">${i[1]}</button>`).join('');A.role==='passenger'?passenger():A.role==='driver'?driver():admin()}
function passenger(){if(A.page==='price')return price();if(A.page==='cars')return cars();if(A.page==='history')return history();if(A.page==='profile')return profile();let t=A.tariff[A.service]||A.tariff.motor,p=Math.max(t[2],t[0]+t[1]*3.5);main.innerHTML=`<div class="grid"><section class="card"><div class="map"><div class="route"></div><div class="pin a">📍</div><div class="pin b">🏁</div></div><p class="muted">Peta demo. Hubungkan Google Maps Platform untuk GPS, Places, Routes, dan tracking real-time.</p></section><section class="card"><h2>Mau ke mana?</h2><label>Lokasi jemput</label><input id="pick" value="Lokasi saya"><label>Tujuan</label><input id="dest" value="Stasiun Bekasi"><label>Layanan</label><div class="services">${Object.entries(sv).map(([k,v])=>`<button class="service ${A.service===k?'sel':''}" onclick="A.service='${k}';render()">${v[1]} <b>${v[0]}</b><small>${k==='motor'?'Mulai '+money(A.tariff.motor[2]):'Lihat layanan'}</small></button>`).join('')}</div><div class="price">${money(p)}</div><p class="muted">3,5 km • ±12 menit • Tunai</p><button class="btn" onclick="book()">Pesan Sekarang</button></section></div><div class="grid3"><div class="card"><b>🎟️ Promo</b><p class="muted">Promo pengguna baru.</p></div><div class="card"><b>💳 Saldo ORIN</b><div class="price" style="font-size:21px">Rp0</div></div><div class="card"><b>🆘 Bantuan</b><p class="muted">Pusat bantuan dan keselamatan.</p></div></div>`}
function book(){let t=A.tariff[A.service]||A.tariff.motor,p=Math.max(t[2],t[0]+t[1]*3.5);A.orders.unshift({id:'ORIN-'+Date.now(),service:sv[A.service]?.[0]||'ORIN',pickup:pick.value,destination:dest.value,price:p,status:'Mencari driver'});save();render();alert('Pesanan ORIN dibuat')}
function price(){main.innerHTML=`<div class="card"><h2>Kalkulator Tarif ORIN</h2><label>Jenis layanan</label><select id="kind" onchange="calc()"><option value="motor">ORIN Motor</option><option value="car">ORIN Mobil</option><option value="comfort">ORIN Comfort</option><option value="xl">ORIN XL</option></select><label>Jarak (km)</label><input id="km" type="number" value="3.5" step="0.1" oninput="calc()"><div id="out"></div><h3>Contoh tarif</h3>${[1,2,3,5,10,20,50].map(x=>`<div class="row"><span>${x} km</span><b id="q${x}">-</b></div>`).join('')}</div>`;calc()}
function calc(){let t=A.tariff[kind.value],d=+km.value||0;out.innerHTML=`<div class="price">${money(Math.max(t[2],t[0]+t[1]*d))}</div><p class="muted">Dasar ${money(t[0])} + ${money(t[1])}/km • minimum ${money(t[2])}</p>`;[1,2,3,5,10,20,50].forEach(x=>document.getElementById('q'+x).textContent=money(Math.max(t[2],t[0]+t[1]*x)))}
function cars(){main.innerHTML=`<div class="card"><h2>Daftar Mobil ORIN</h2>${A.cars.map(c=>`<div class="car card"><div class="carpic">🚗</div><div><b>${c[0]}</b><div class="muted">${c[1]} • ${c[2]}</div><div>${c[3]} • ⭐ 4,9</div></div></div>`).join('')}</div>`}
function history(){main.innerHTML=`<div class="card"><h2>Riwayat Pesanan</h2>${A.orders.length?'<table><tr><th>ID</th><th>Layanan</th><th>Rute</th><th>Total</th><th>Status</th></tr>'+A.orders.map(o=>`<tr><td>${o.id.slice(-8)}</td><td>${o.service}</td><td>${o.pickup} → ${o.destination}</td><td>${money(o.price)}</td><td>${o.status}</td></tr>`).join('')+'</table>':'<p class="muted">Belum ada perjalanan.</p>'}</div>`}function profile(){main.innerHTML='<div class="card"><h2>Profil Penumpang</h2><label>Nama</label><input value="Pengguna ORIN"><label>No. HP</label><input value="08xxxxxxxxxx"><button class="btn" onclick="alert(\'Profil disimpan\')">Simpan</button></div>'}
function driver(){if(A.page==='orders')return driverOrders();if(A.page==='income')return driverIncome();main.innerHTML=`<div class="grid"><div class="card"><h2>Dashboard Driver</h2><button class="btn" onclick="A.online=!A.online;render()">${A.online?'🔴 Offline':'🟢 Online'}</button><div class="status">${A.online?'Siap menerima order.':'Sedang offline.'}</div></div><div class="card"><h2>Order Terbaru</h2>${A.orders[0]?`<b>${A.orders[0].service}</b><p class="muted">${A.orders[0].pickup} → ${A.orders[0].destination}</p><div class="price">${money(A.orders[0].price)}</div><button class="btn" onclick="accept()">Terima Order</button>`:'<p class="muted">Belum ada order.</p>'}</div></div>`}function accept(){if(A.orders[0]){A.orders[0].status='Driver menuju lokasi';A.orders[0].driver='Budi — Driver ORIN';save();render();alert('Order diterima')}}function driverOrders(){main.innerHTML='<div class="card"><h2>Order Masuk</h2>'+A.orders.map(o=>`<div class="row"><span><b>${o.service}</b><br><small>${o.pickup} → ${o.destination}</small></span><b>${money(o.price)}</b></div>`).join('')+'</div>'}function driverIncome(){let x=A.orders.filter(o=>o.status==='Selesai').reduce((a,o)=>a+o.price*.8,0);main.innerHTML=`<div class="statgrid"><div class="stat">Pendapatan<b>${money(x)}</b></div><div class="stat">Order<b>${A.orders.length}</b></div><div class="stat">Rating<b>4,9 ⭐</b></div><div class="stat">Bonus<b>Rp0</b></div></div>`}
function admin(){if(A.page==='orders')return adminOrders();if(A.page==='tariff')return adminTariff();if(A.page==='cars')return adminCars();let total=A.orders.reduce((a,o)=>a+o.price,0);main.innerHTML=`<div class="statgrid"><div class="stat">Pengguna<b>1.284</b></div><div class="stat">Driver<b>428</b></div><div class="stat">Order<b>${A.orders.length}</b></div><div class="stat">Transaksi<b>${money(total)}</b></div></div><div class="grid3"><div class="card"><b>🟢 Driver Online</b><div class="price">126</div></div><div class="card"><b>🏪 Merchant</b><div class="price">87</div></div><div class="card"><b>📈 Pendapatan ORIN</b><div class="price">${money(total*.2)}</div></div></div>`}function adminOrders(){main.innerHTML='<div class="card"><h2>Kelola Order</h2><table><tr><th>ID</th><th>Layanan</th><th>Driver</th><th>Status</th><th>Total</th></tr>'+A.orders.map(o=>`<tr><td>${o.id.slice(-8)}</td><td>${o.service}</td><td>${o.driver||'-'}</td><td>${o.status}</td><td>${money(o.price)}</td></tr>`).join('')+'</table></div>'}function adminTariff(){main.innerHTML='<div class="card"><h2>Pengaturan Tarif</h2>'+Object.keys(A.tariff).map(k=>`<h3>${sv[k][0]}</h3><div class="grid3"><input id="${k}0" value="${A.tariff[k][0]}"><input id="${k}1" value="${A.tariff[k][1]}"><input id="${k}2" value="${A.tariff[k][2]}"></div>`).join('')+'<button class="btn" onclick="saveTariff()">Simpan Tarif</button></div>'}function saveTariff(){Object.keys(A.tariff).forEach(k=>A.tariff[k]=[+document.getElementById(k+'0').value,+document.getElementById(k+'1').value,+document.getElementById(k+'2').value]);alert('Tarif diperbarui');render()}function adminCars(){main.innerHTML='<div class="card"><h2>Kelola Kendaraan</h2>'+A.cars.map((c,i)=>`<div class="row"><span>🚗 <b>${c[0]}</b><br><small>${c[3]} • ${c[1]}</small></span><button onclick="A.cars.splice(${i},1);render()">Hapus</button></div>`).join('')+'<button class="btn" onclick="A.cars.push([\'Mitsubishi Xpander\',\'ORIN XL\',\'2025\',\'B 7777 OIN\']);render()">+ Tambah Mobil</button></div>'}
render();</script></body></html>
